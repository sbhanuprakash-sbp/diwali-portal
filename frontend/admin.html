<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Diwali Portal · Private Admin</title><style>
:root{color-scheme:dark;--bg:#0b0714;--line:#3a2b50;--gold:#ffd166;--muted:#bcaecf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#30204c,var(--bg) 55%) fixed;color:#fff;font:15px system-ui,Segoe UI,sans-serif;padding:24px}.wrap{max-width:1250px;margin:auto}h1,h2,h3{color:var(--gold)}h3{margin:18px 0 8px}.panel{background:#171126dd;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.grid .panel{margin:0}.stat{font-size:28px;color:var(--gold);font-weight:700}input,textarea,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid var(--line);background:#0e0a18;color:#fff;margin:4px 0}button{background:linear-gradient(120deg,#ffe08a,#ff9f1c);color:#261400;font-weight:700;cursor:pointer;border:0}button.sm{padding:5px 9px;font-size:13px;margin:2px}button.alt,.tabs button{background:#302342;color:#fff}.tabs{display:flex;flex-wrap:wrap;gap:8px}.tabs button.active{background:var(--gold);color:#261400}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--gold);white-space:nowrap}.scroll{overflow:auto}.muted{color:var(--muted)}.hidden{display:none}.msg{white-space:pre-wrap;overflow-wrap:anywhere;min-width:220px}#status,.note{color:#ffc0ce;min-height:22px}.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:14px 0}.filters label{font-size:12px;color:var(--muted);display:block}.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;margin:4px 0}.bar i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#ffe08a,#ff9f1c)}.bar b{text-align:right}.spark{display:flex;align-items:flex-end;gap:3px;height:110px;border-bottom:1px solid var(--line)}.spark div{flex:1;background:linear-gradient(#ffe08a,#ff9f1c);border-radius:3px 3px 0 0;min-height:2px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}.ok{color:#9dffb8}.bad{color:#ff9db8}form input,form textarea{width:100%;max-width:520px;display:block}
</style></head><body><main class="wrap"><h1>🪔 Diwali Portal · Private Admin</h1><p class="muted">Private visitor records. Keep this page and your admin credentials confidential. Times are shown in your local time zone.</p>
<section class="panel" id="login"><h2>Administrator login</h2><form id="loginForm"><input id="username" placeholder="Admin username" autocomplete="username"><input id="password" type="password" placeholder="Admin password" autocomplete="current-password"><button>Sign in</button></form><div id="status"></div></section>
<div id="app" class="hidden"><section class="grid" id="stats"></section>
<section class="panel"><div class="tabs" id="tabs"></div>
<div class="filters" id="filters"><div><label>From</label><input type="date" id="fFrom"></div><div><label>To</label><input type="date" id="fTo"></div><div><label>Search</label><input id="fQ" placeholder="name, relation, text…"></div><div><label>Status</label><select id="fStatus"></select></div><button id="apply">Apply</button><button class="alt" id="clear">Clear</button><button class="alt" id="export">⬇ Export CSV</button></div>
<div id="content"></div></section><button id="refresh">Refresh data</button> <button class="alt" id="logout">Log out</button></div></main>
<script src="config.js"></script>
<script>
const cfg=window.PORTAL_CONFIG||{},API=(['localhost','127.0.0.1'].indexOf(location.hostname)!==-1)?'http://127.0.0.1:5000':String(cfg.API_BASE||'').replace(/\/+$/,'');
const TABS={analytics:'Analytics',visits:'Visitor entries',logins:'Login attempts',sessions:'Sessions',replies:'Replies',recipients:'Accounts'};
const STATUS={visits:['Logged in','No login'],logins:['Success','Failed'],sessions:['Active','Ended'],recipients:['Active','Disabled']};
let token='',tab='analytics',cache=[],editing=null;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function req(path,opts={}){if(!/^https?:\/\//.test(API)||/YOUR-SERVICE/i.test(API))throw Error('config.js still has the placeholder server address.');const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed ('+r.status+')');return d}
const qs=()=>{const p=new URLSearchParams();[['date_from','fFrom'],['date_to','fTo'],['q','fQ'],['status','fStatus']].forEach(([k,i])=>{if($(i).value)p.set(k,$(i).value)});return p.toString()};
$('tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-tab="${k}">${v}</button>`).join('');
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await req('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});token=d.token;$('password').value='';$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(err){$('status').textContent=err.message}};
async function load(){try{const o=await req('/api/admin/overview');const L={visits:'Visits','unique_ips':'Unique IPs',login_sessions:'Login sessions',active_sessions:'Active now',successful_logins:'Successful logins',failed_logins:'Failed logins',replies:'Replies',recipients:'Accounts'};$('stats').innerHTML=Object.entries(L).map(([k,t])=>`<div class="panel"><div class="muted">${t}</div><div class="stat">${o[k]}</div></div>`).join('');await showTab(tab,true)}catch(e){$('content').textContent=e.message}}
const bars=(t,p)=>{const m=Math.max(1,...p.map(x=>x[1]));return `<h3>${t}</h3>`+(p.length?p.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${v/m*100}%"></i><b>${v}</b></div>`).join(''):'<p class="muted">No data yet.</p>')};
const cell=(k,v,row)=>{if(v==null||v==='')return '—';if(k.endsWith('_at'))return esc(new Date(v).toLocaleString());if(k==='message')return `<div class="msg">${esc(v)}</div>`;if(k==='status')return `<span class="${/Success|Active|Logged in/.test(v)?'ok':/Failed|Disabled/.test(v)?'bad':''}">${esc(v)}</span>`;return esc(v)};
async function showTab(t,keep){tab=t;if(!keep){$('fStatus').value=''}document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
$('fStatus').innerHTML='<option value="">All</option>'+(STATUS[t]||[]).map(s=>`<option>${s}</option>`).join('');
const a=t==='analytics';$('filters').classList.toggle('hidden',a);
if(a){const d=await req('/api/admin/analytics');const m=Math.max(1,...d.visits_per_day.map(x=>x[1]));$('content').innerHTML=`<div class="cols"><div>${bars('Most-selected relationships',d.relationships)}</div><div>${bars('Devices',d.devices)}</div></div><h3>Visits per day (last 30 days)</h3><div class="spark">${d.visits_per_day.map(([day,n])=>`<div title="${day}: ${n}" style="height:${n/m*100}%"></div>`).join('')}</div>`;return}
const d=await req('/api/admin/table/'+t+'?'+qs());cache=d.items;const isR=t==='recipients';
let html=(isR?formHtml():'')+`<p class="muted">${d.items.length} record(s)</p><div class="scroll"><table><thead><tr>${d.columns.map(c=>`<th>${c[1]}</th>`).join('')}${isR?'<th>Actions</th>':''}</tr></thead><tbody>${d.items.map((r,i)=>`<tr>${d.columns.map(c=>`<td>${cell(c[0],r[c[0]],r)}</td>`).join('')}${isR?`<td><button class="sm alt" data-act="edit" data-i="${i}">Edit</button><button class="sm alt" data-act="toggle" data-i="${i}">${r.status==='Active'?'Disable':'Enable'}</button><button class="sm alt" data-act="reset" data-i="${i}">Reset secret</button></td>`:''}</tr>`).join('')}</tbody></table></div>`;
$('content').innerHTML=html;if(isR)bindForm()}
function formHtml(){return `<h3 id="formTitle">Create visitor account</h3><p class="muted">Login names: 3–40 characters (a–z, 0–9, . _ -). Secrets are stored as hashes and can never be viewed, only reset.</p><form id="acctForm"><input name="display_name" required placeholder="Display name (shown on their page)"><input name="username" required placeholder="Login name (lowercase, no spaces)"><input name="password" required type="password" placeholder="Initial secret (10+ characters)"><input name="relation_label" placeholder="Relationship label"><input name="photo_url" placeholder="Photo URL (https://…, optional)"><textarea name="greeting" rows="4" placeholder="Personal Diwali greeting"></textarea><button id="saveBtn">Create account</button> <button type="button" class="alt hidden" id="cancelEdit">Cancel edit</button> <span class="note" id="formStatus"></span></form>`}
function setEdit(r){editing=r?r.id:null;const f=$('acctForm');f.reset();['display_name','relation_label','photo_url','greeting'].forEach(k=>f[k].value=r?(r[k]||''):'');f.username.value=r?r.username:'';f.username.disabled=!!r;f.password.disabled=!!r;f.password.required=!r;f.password.classList.toggle('hidden',!!r);$('formTitle').textContent=r?'Edit '+r.username:'Create visitor account';$('saveBtn').textContent=r?'Save changes':'Create account';$('cancelEdit').classList.toggle('hidden',!r)}
function bindForm(){$('cancelEdit').onclick=()=>setEdit(null);$('acctForm').onsubmit=async e=>{e.preventDefault();const f=e.target,s=$('formStatus');s.textContent='';try{let out;if(editing){const b={display_name:f.display_name.value,relation_label:f.relation_label.value,photo_url:f.photo_url.value,greeting:f.greeting.value};out=await req('/api/admin/recipients/'+editing,{method:'PATCH',body:JSON.stringify(b)})}else out=await req('/api/admin/recipients',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f).entries()))});await load();$('formStatus').textContent=out.message}catch(err){s.textContent=err.message}}}
$('content').onclick=async e=>{const b=e.target.closest('[data-act]');if(!b)return;const r=cache[+b.dataset.i];try{if(b.dataset.act==='edit'){setEdit(r);scrollTo(0,300)}
if(b.dataset.act==='toggle'&&confirm((r.status==='Active'?'Disable ':'Enable ')+r.username+'?')){await req('/api/admin/recipients/'+r.id,{method:'PATCH',body:JSON.stringify({active:r.status!=='Active'})});await load()}
if(b.dataset.act==='reset'){const p=prompt('New secret for '+r.username+' (10+ characters). Their current sessions will be ended.');if(p){const o=await req('/api/admin/recipients/'+r.id+'/reset-password',{method:'POST',body:JSON.stringify({password:p})});alert(o.message)}}}catch(err){alert(err.message)}};
$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){showTab(b.dataset.tab)}};
$('apply').onclick=()=>showTab(tab,true).catch(e=>alert(e.message));
$('clear').onclick=()=>{['fFrom','fTo','fQ','fStatus'].forEach(i=>$(i).value='');showTab(tab,true)};
$('export').onclick=async()=>{try{const r=await fetch(API+'/api/admin/export/'+tab+'?'+qs(),{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Export failed');const u=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=u;a.download='diwali-'+tab+'.csv';a.click();URL.revokeObjectURL(u)}catch(e){alert(e.message)}};
$('refresh').onclick=load;$('logout').onclick=()=>{token='';cache=[];$('app').classList.add('hidden');$('login').classList.remove('hidden')};
</script></body></html>
